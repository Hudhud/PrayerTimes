name: Verify and deploy Salah Times

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: test-root
          MARIADB_DATABASE: salahtimes_test
          MARIADB_USER: salahtimes_test
          MARIADB_PASSWORD: test-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=3s --health-timeout=5s --health-retries=15
    env:
      PRAYERTIMES_TEST_DATABASE: Server=127.0.0.1;Port=3306;Database=salahtimes_test;User ID=salahtimes_test;Password=test-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore PrayerTimes.sln --locked-mode
      - run: dotnet test PrayerTimes.sln --configuration Release --no-restore

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: verify
    runs-on: windows-latest
    concurrency:
      group: salahtimes-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Publish
        run: >-
          dotnet publish ./Web/Web.csproj
          --configuration Release
          --output ./publish
          --runtime win-x86
          --self-contained true
      - name: Deploy to Simply with Web Deploy
        uses: rasmusbuchholdt/simply-web-deploy@2.2.0
        with:
          website-name: salahtimes.dk
          server-computer-name: https://nt38.unoeuro.com:8172
          server-username: salahtimes.dk
          server-password: ${{ secrets.SERVER_PASSWORD }}
          source-path: '\publish\'
          target-delete: false
