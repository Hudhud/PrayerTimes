name: Verify and deploy Salah Times

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore PrayerTimes.sln --locked-mode
      - run: dotnet test PrayerTimes.sln --configuration Release --no-restore
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: Tests/Browser/package-lock.json
      - name: Verify browser flows
        working-directory: Tests/Browser
        run: |
          npm ci
          npx playwright install --with-deps chromium webkit
          npm test

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: verify
    runs-on: windows-latest
    concurrency:
      group: salahtimes-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Publish
        run: >-
          dotnet publish ./Web/Web.csproj
          --configuration Release
          --output ./publish
          --runtime win-x86
          --self-contained true
      - name: Deploy to Simply with Web Deploy
        uses: rasmusbuchholdt/simply-web-deploy@2.2.0
        with:
          website-name: salahtimes.dk
          server-computer-name: https://nt38.unoeuro.com:8172
          server-username: salahtimes.dk
          server-password: ${{ secrets.SERVER_PASSWORD }}
          source-path: '\publish\'
          target-delete: false

  smoke:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: Tests/Browser/package-lock.json
      - name: Verify Salah Times in production
        working-directory: Tests/Browser
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run smoke
